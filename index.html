<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SatiFlow · protótipo</title>
<meta name="description" content="Protótipo navegável do SatiFlow, para validação de escopo. Dados fictícios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/estilo.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23080808'/><path d='M8 21h4v3H8zM14 14h4v10h-4zM20 8h4v16h-4z' fill='%23ff6900'/></svg>">
</head>
<body>

<!-- Faixa de aviso: o protótipo nunca pode ser confundido com o sistema. -->
<div class="aviso-topo" role="note">
  <strong>Protótipo para validação de escopo.</strong>
  Nada aqui grava de verdade; os dados são fictícios.
  <button type="button" class="aviso-topo__acao" data-acao="reiniciar">Reiniciar demonstração</button>
</div>

<div class="app" id="app">

  <aside class="lateral">
    <div class="marca">
      <span class="marca__nome">Sati<span>Flow</span></span>
      <span class="marca__tag">protótipo</span>
    </div>

    <nav class="menu" id="menu" aria-label="Módulos"></nav>

    <div class="lateral__rodape">
      <label class="campo-rotulo" for="troca-perfil">Ver o sistema como</label>
      <select id="troca-perfil" class="select"></select>
      <p class="dica" id="dica-perfil"></p>
    </div>
  </aside>

  <div class="conteudo">
    <header class="cabecalho">
      <button type="button" class="busca-gatilho" data-acao="abrir-busca">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span>CTRC, CT-e, AWB, fatura, nota, chave, CNPJ, nome, valor…</span>
        <kbd>Ctrl K</kbd>
      </button>

      <div class="cabecalho__direita">
        <label class="campo-rotulo" for="troca-filial">Filial</label>
        <select id="troca-filial" class="select select--compacto"></select>

        <button type="button" class="icone-botao" data-acao="abrir-auditoria" title="Trilha de auditoria">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l3 2"/><circle cx="12" cy="12" r="9"/></svg>
          <span class="selo" id="selo-auditoria">0</span>
        </button>

        <div class="usuario" id="usuario"></div>
      </div>
    </header>

    <main class="principal" id="principal" tabindex="-1"></main>
  </div>
</div>

<!-- Painel lateral: a ficha do documento e as ações do dia moram aqui. -->
<div class="gaveta" id="gaveta" hidden>
  <div class="gaveta__fundo" data-acao="fechar-gaveta"></div>
  <section class="gaveta__painel" role="dialog" aria-modal="true" aria-labelledby="gaveta-titulo">
    <header class="gaveta__topo">
      <h2 id="gaveta-titulo"></h2>
      <button type="button" class="icone-botao" data-acao="fechar-gaveta" aria-label="Fechar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="gaveta__corpo" id="gaveta-corpo"></div>
  </section>
</div>

<!-- Caixa de confirmação: toda escrita passa por aqui antes de ir ao TMS. -->
<div class="modal" id="modal" hidden>
  <div class="modal__fundo" data-acao="fechar-modal"></div>
  <section class="modal__caixa" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
    <h2 id="modal-titulo"></h2>
    <div id="modal-corpo"></div>
    <footer class="modal__acoes" id="modal-acoes"></footer>
  </section>
</div>

<!-- Busca global -->
<div class="paleta" id="paleta" hidden>
  <div class="paleta__fundo" data-acao="fechar-busca"></div>
  <section class="paleta__caixa" role="dialog" aria-modal="true" aria-label="Busca">
    <input type="search" id="paleta-campo" class="paleta__campo" autocomplete="off"
           placeholder="CTRC, CT-e, AWB, fatura, nota, chave, CNPJ, nome, valor…">
    <div class="paleta__resultados" id="paleta-resultados"></div>
  </section>
</div>

<div class="avisos" id="avisos" aria-live="polite"></div>

<script src="assets/dados.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
